name: Docs deployment

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'overrides/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'scripts/ci/classify_docs_visual_changes.py'
      - 'scripts/ci/test-classify-docs-visual-changes.py'
      - 'scripts/api_reference_release.py'
      - 'scripts/check_api_reference_install.py'
      - 'scripts/check-docs-analytics.py'
      - 'scripts/check-docs-layout.py'
      - 'scripts/mkdocs_hooks.py'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-pr.yml'
      - '.github/workflows/docs-visual.yml'
  workflow_call:
    inputs:
      source_ref:
        description: Immutable SDK release commit to render; direct main pushes use the event commit.
        required: false
        type: string
      source_base_sha:
        description: Immutable parent revision used to classify release visual changes.
        required: false
        type: string
      published_release:
        description: Allow deployment after the caller has published this exact release to PyPI.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-deployment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Install package + docs deps
        run: pip install -e '.[docs]'

      - name: Install browser for responsive layout checks
        run: python -m playwright install --with-deps chromium

      - name: Build site
        env:
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: |
          python scripts/ci/test-classify-docs-visual-changes.py
          mkdocs build --strict
          python scripts/check_api_reference_install.py --site site
          python scripts/check-docs-analytics.py site
          python scripts/check-docs-layout.py site
          if [ "$GITHUB_SERVER_URL" = https://github.com ]; then
            if ! printf '%s' "$CLOUDFLARE_WEB_ANALYTICS_TOKEN" | grep -Eq '^[a-f0-9]{32}$'; then
              echo 'CLOUDFLARE_WEB_ANALYTICS_TOKEN must be the canonical 32-character site token' >&2
              exit 1
            fi
            sed -i "s/__CLOUDFLARE_WEB_ANALYTICS_TOKEN__/$CLOUDFLARE_WEB_ANALYTICS_TOKEN/" \
              docs/javascripts/analytics.js
            mkdocs build --strict
            python scripts/check_api_reference_install.py --site site
            python scripts/check-docs-analytics.py site --require-token
          fi

      - name: Verify the rendered command against public PyPI
        if: ${{ github.server_url == 'https://github.com' }}
        run: python scripts/check_api_reference_install.py --site site --install

      - name: Upload GitHub Pages artifact
        if: ${{ github.server_url == 'https://github.com' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: site

  visual-evidence:
    uses: ./.github/workflows/docs-visual.yml
    with:
      source_base_sha: ${{ inputs.source_base_sha || github.event.before }}
      source_ref: ${{ inputs.source_ref || github.sha }}
    permissions:
      contents: read

  deploy:
    needs: [build, visual-evidence]
    if: >-
      github.server_url == 'https://github.com' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.published_release)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5
