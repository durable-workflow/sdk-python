[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "durable-workflow"
version = "2.0.1"
description = "Python client and worker SDK for Durable Workflow Cloud and self-hosted Server"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Durable Workflow Contributors" },
]
keywords = [
    "cloud",
    "durable-execution",
    "workflow",
    "durable",
    "orchestration",
    "python",
    "sdk",
    "saga",
]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "fastavro>=1.12.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "playwright>=1.48,<2",
    "PyYAML>=6.0",
    "ruff>=0.4",
    "tomli>=2; python_version < '3.11'",
]
prometheus = [
    "prometheus-client>=0.20",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "playwright>=1.48,<2",
    "tomli>=2; python_version < '3.11'",
]

[project.urls]
Homepage = "https://python.durable-workflow.com/"
Documentation = "https://python.durable-workflow.com/"
Repository = "https://github.com/durable-workflow/sdk-python"
Issues = "https://github.com/durable-workflow/sdk-python/issues"

[project.scripts]
durable-workflow-replay-verify = "durable_workflow.replay_verify:main"
durable-workflow-history-bundle-verify = "durable_workflow.history_bundle_verify:main"
durable-workflow-python-conformance = "durable_workflow.python_conformance:main"
durable-workflow-replay-conformance = "durable_workflow.replay_conformance:main"
durable-workflow-workflow-updates-conformance = "durable_workflow.workflow_updates_conformance:main"

[tool.durable-workflow]
product-train = "2.0.1"
registry-version = "2.0.1"
supported-server-versions = "2.0.0"
worker-protocol-version = "1.19"
control-plane-version = "2"
durable-selection = true
durable-selection-minimum-worker-protocol-version = "1.19"
message-streams = true
message-streams-minimum-worker-protocol-version = "1.15"
workflow-streams-contract = "durable-workflow.v2.workflow-streams.contract@1"
workflow-streams-operations = "list,describe,subscribe,append,close,error"
workflow-streams-authoring-command = "record_side_effect.workflow_stream"
workflow-streams-delivery = "at-least-once"
workflow-streams-external-payload-references = "read-write"
deterministic-parallel = true
parallel-authoring = "nested-list-yield"
parallel-members = "activity,child,timer,mixed"
parallel-result-order = "input-position"
parallel-group-metadata = "parallel_group_id,parallel_group_kind,parallel_group_base_sequence,parallel_group_size,parallel_group_index,parallel_group_path"
saga-compensation = true
saga-compensation-order = "reverse-registration-sequential"
saga-compensation-failure-policy = "stop-first-preserve-initiating-and-compensation"
saga-cancellation = "cooperative"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require a running server (deselect with '-m \"not integration\"')",
]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["durable_workflow"]
mypy_path = "src"

# fastavro does not ship complete type stubs; treat it as Any.
[[tool.mypy.overrides]]
module = ["fastavro", "fastavro.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
