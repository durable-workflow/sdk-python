[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "durable-workflow"
version = "2.0.0-rc.35"
description = "Release candidate Python SDK for the Durable Workflow 2.0 train"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Durable Workflow Contributors" },
]
keywords = [
    "workflow",
    "durable",
    "orchestration",
    "temporal",
    "saga",
]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "fastavro>=1.12.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "playwright>=1.48,<2",
    "PyYAML>=6.0",
    "ruff>=0.4",
    "tomli>=2; python_version < '3.11'",
]
prometheus = [
    "prometheus-client>=0.20",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "playwright>=1.48,<2",
    "tomli>=2; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/durable-workflow/sdk-python"
Documentation = "https://durable-workflow.github.io/docs/2.0/polyglot/python"
Repository = "https://github.com/durable-workflow/sdk-python"
Issues = "https://github.com/durable-workflow/sdk-python/issues"

[project.scripts]
durable-workflow-replay-verify = "durable_workflow.replay_verify:main"
durable-workflow-history-bundle-verify = "durable_workflow.history_bundle_verify:main"
durable-workflow-python-conformance = "durable_workflow.python_conformance:main"
durable-workflow-replay-conformance = "durable_workflow.replay_conformance:main"
durable-workflow-workflow-updates-conformance = "durable_workflow.workflow_updates_conformance:main"

[tool.durable-workflow]
product-train = "2.0.0-rc.35"
registry-version = "2.0.0rc35"
supported-server-versions = "2.0.0-rc.43"
worker-protocol-version = "1.1"
control-plane-version = "2"
workflow-streams-contract = "durable-workflow.v2.workflow-streams.contract@1"
workflow-streams-operations = "list,describe,subscribe,append,close,error"
workflow-streams-authoring-command = "record_side_effect.workflow_stream"
workflow-streams-delivery = "at-least-once"
workflow-streams-external-payload-references = "read-write"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require a running server (deselect with '-m \"not integration\"')",
]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["durable_workflow"]
mypy_path = "src"

# fastavro does not ship complete type stubs; treat it as Any.
[[tool.mypy.overrides]]
module = ["fastavro", "fastavro.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
