# Source qualification only. Published Composer authority stays in the image.
services:
  bootstrap:
    volumes:
      - ${DURABLE_WORKFLOW_NATIVE_SOURCE:?exact Native checkout}:/app/vendor/durable-workflow/workflow:ro
  server:
    volumes:
      - ${DURABLE_WORKFLOW_NATIVE_SOURCE:?exact Native checkout}:/app/vendor/durable-workflow/workflow:ro
      - ./tests/integration/native-scope-request.php:/app/sdk-source-fixtures/native-scope-request.php:ro
  worker:
    volumes:
      - ${DURABLE_WORKFLOW_NATIVE_SOURCE:?exact Native checkout}:/app/vendor/durable-workflow/workflow:ro
  repair:
    volumes:
      - ${DURABLE_WORKFLOW_NATIVE_SOURCE:?exact Native checkout}:/app/vendor/durable-workflow/workflow:ro
